i[data-lucide="receipt-text"]:empty:before{content:"🧾"} i[data-lucide="heart-handshake"]:empty:before{content:"💞"}

/* ---------- LOGIN ---------- */
#login{min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:24px;background:linear-gradient(170deg,var(--bg2),var(--bg) 60%)}
.lg-card{width:100%;max-width:340px;text-align:center}
.lg-emoji{font-size:44px;letter-spacing:-6px}
.lg-title{font-size:22px;font-weight:800;margin:10px 0 2px}
.lg-sub{color:var(--sub);font-size:13px;margin-bottom:26px}
.dots{display:flex;gap:14px;justify-content:center;margin-bottom:10px;height:18px}
.dot{width:14px;height:14px;border-radius:50%;background:transparent;border:2px solid var(--line);transition:.18s}
.dot.on{background:var(--accent);border-color:var(--accent);transform:scale(1.12)}
.lg-err{color:var(--accent);font-size:13px;font-weight:700;height:20px;margin-bottom:8px}
.shake{animation:shake .4s}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-9px)}40%{transform:translateX(9px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:14px}
.pad button{height:62px;border-radius:50%;background:var(--card);box-shadow:var(--sh);font-size:22px;font-weight:700;
  display:flex;align-items:center;justify-content:center;transition:.12s}
.pad button:active{transform:scale(.92);background:var(--bg2)}
.pad .ghost{box-shadow:none;background:transparent;font-size:18px;color:var(--sub)}
.lg-hint{margin-top:22px;font-size:12px;color:var(--sub)}

/* ---------- SHELL ---------- */
.head{position:sticky;top:0;z-index:40}
.syncbar{display:flex;align-items:center;gap:10px;padding:9px 14px;cursor:pointer;
  border-bottom:1px solid rgba(0,0,0,.06);animation:slidein .25s ease}
@keyframes slidein{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.syncbar.bad{background:#FFE0DB;color:#A83A2C}
.syncbar.new{background:#DDF0E7;color:#1D6B51}
.syncbar.warn{background:#FFF0D2;color:#835E12}
.syncbar .ic{font-size:17px;flex-shrink:0;line-height:1}
.syncbar b{display:block;font-weight:800;font-size:12.5px;line-height:1.35}
.syncbar em{font-style:normal;display:block;font-size:11px;opacity:.85;line-height:1.4}
.syncbar .go{margin-left:auto;font-size:11px;font-weight:800;white-space:nowrap;opacity:.75}
.topbar{position:relative;z-index:40;display:flex;align-items:center;gap:6px;
  padding:calc(env(safe-area-inset-top) + 10px) 12px 10px;background:color-mix(in srgb,var(--bg) 88%,transparent);
  backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.brand{font-weight:800;font-size:14px;margin-right:auto;display:flex;align-items:center;gap:4px;
  white-space:nowrap;overflow:hidden;min-width:0}
@media (max-width:379px){.brand b{display:none}}
.who{display:flex;align-items:center;gap:4px;font-size:10.5px;font-weight:800;padding:6px 9px;
  border-radius:999px;white-space:nowrap;flex-shrink:0}
.who.keisuke{background:var(--k-bg);color:var(--k)} .who.kotomi{background:var(--ko-bg);color:var(--ko)}
.icobtn{width:32px;height:32px;flex-shrink:0;border-radius:50%;display:flex;align-items:center;justify-content:center;
  background:var(--card);box-shadow:var(--sh);font-size:16px;color:var(--sub)}
.icobtn:active{transform:scale(.92)}
.cloud-dot{position:absolute;margin:-14px 0 0 18px;width:8px;height:8px;border-radius:50%;background:var(--sub);border:2px solid var(--card)}
.cloud-dot.on{background:var(--ok)} .cloud-dot.err{background:var(--accent2)}
main{padding:14px 14px calc(96px + env(safe-area-inset-bottom));max-width:620px;margin:0 auto}
.view{display:none;animation:fade .22s ease}
.view.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:50;display:flex;
  padding:6px 4px calc(6px + env(safe-area-inset-bottom));background:color-mix(in srgb,var(--card) 92%,transparent);
  backdrop-filter:blur(14px);border-top:1px solid var(--line)}
.tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;
  color:var(--sub);font-size:10px;font-weight:700;border-radius:14px;transition:.15s}
.tabbar button i{font-size:20px}
.tabbar button.on{color:var(--accent)}
.tabbar button.on i{transform:translateY(-1px)}

/* ---------- COMMON ---------- */
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:16px;margin-bottom:12px}
.sec-head{display:flex;align-items:center;gap:8px;margin:4px 2px 10px}
.sec-head h2{font-size:15px;font-weight:800;margin:0;display:flex;align-items:center;gap:6px}
.sec-head .sp{margin-left:auto}
.btn{display:inline-flex;align-items:center;gap:6px;padding:9px 15px;border-radius:999px;font-size:13px;font-weight:700;
  background:var(--accent);color:#fff;box-shadow:0 4px 12px rgba(255,124,107,.32);transition:.12s}
.btn:active{transform:scale(.95)}
.btn.sm{padding:7px 12px;font-size:12px}
.btn.ghost{background:var(--card);color:var(--ink);box-shadow:var(--sh)}
.btn.line{background:transparent;color:var(--sub);box-shadow:none;border:1px solid var(--line)}
.chips{display:flex;gap:7px;flex-wrap:wrap;padding:2px 2px 8px}
.chip{white-space:nowrap;padding:7px 13px;border-radius:999px;font-size:12px;font-weight:700;background:var(--card);
  color:var(--sub);box-shadow:var(--sh)}
.chip.on{background:var(--ink);color:var(--bg)}
.badge{display:inline-flex;align-items:center;gap:3px;font-size:10px;font-weight:800;padding:2px 8px;border-radius:999px}
.badge.keisuke{background:var(--k-bg);color:var(--k)} .badge.kotomi{background:var(--ko-bg);color:var(--ko)}
.badge.both{background:var(--bg2);color:var(--sub)}
.badge.joint{background:#E7F4EE;color:#2C7F63}
.pill.wait{background:#FFF0D2;color:#8A6212}
.pill.paid{background:#E4F3EB;color:#2C7F63}
@media (prefers-color-scheme:dark){.badge.joint{background:#1E3A31;color:#7FD3B4}
 .pill.wait{background:#3E3320;color:#E0B963}.pill.paid{background:#1E3A31;color:#7FD3B4}}
.muted{color:var(--sub);font-size:12px}
.empty{text-align:center;color:var(--sub);font-size:13px;padding:26px 10px}
.empty div{font-size:30px;margin-bottom:6px}
.row{display:flex;align-items:center;gap:10px}
.pill{font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--bg2);color:var(--sub)}
.item{display:flex;align-items:flex-start;gap:11px;padding:12px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:none}
.iact{margin-left:auto;display:flex;gap:2px;flex-shrink:0}
.iact button{width:28px;height:28px;border-radius:8px;color:var(--sub);font-size:14px;display:flex;align-items:center;justify-content:center}
.iact button:active{background:var(--bg2)}

/* ---------- MOOD ---------- */
.mood-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.mood{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:14px 12px;text-align:center;position:relative;overflow:hidden}
.mood:before{content:"";position:absolute;inset:0 0 auto;height:5px;background:var(--mc)}
.mood .nm{font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:4px}
.mood .em{font-size:40px;line-height:1.25;filter:drop-shadow(0 3px 6px rgba(0,0,0,.12))}
.mood .val{font-size:17px;font-weight:800;color:var(--mc)}
.mood .cm{font-size:12px;color:var(--ink);background:var(--bg2);border-radius:12px;padding:6px 8px;margin-top:6px;
  min-height:30px;display:flex;align-items:center;justify-content:center;line-height:1.35}
.mood .tm{font-size:10px;color:var(--sub);margin-top:6px}
.mbar{height:7px;border-radius:99px;background:var(--bg2);margin:8px 4px 2px;position:relative}
.mbar span{position:absolute;top:50%;width:13px;height:13px;border-radius:50%;background:var(--mc);
  transform:translate(-50%,-50%);box-shadow:0 0 0 3px var(--card);transition:left .5s cubic-bezier(.3,1.4,.5,1)}
.mood .edit{margin-top:9px;width:100%;justify-content:center;display:flex}
.mood-scale{display:flex;justify-content:space-between;font-size:9px;color:var(--sub);padding:0 3px}
/* 金曜のおすすめカード */
.feed{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:16px;margin-bottom:12px;
  border:1.5px solid #BFE3D3}
.feed .fh{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:800;color:#2C7F63}
.feed .fh .x{margin-left:auto;color:var(--sub);font-size:16px;width:26px;height:26px;border-radius:8px;
  display:flex;align-items:center;justify-content:center}
.feed .greet{font-size:14px;font-weight:700;margin:8px 0 12px;line-height:1.6}
.idea{border-top:1px solid var(--line);padding:11px 0}
.idea .it{font-size:14px;font-weight:800;line-height:1.5}
.idea .iw{font-size:12px;color:var(--sub);margin-top:3px;line-height:1.7}
.idea .ib{display:flex;gap:7px;margin-top:8px;flex-wrap:wrap}
.idea .ib a,.idea .ib button{font-size:11.5px;font-weight:800;padding:6px 11px;border-radius:99px;
  background:var(--bg2);color:var(--sub);text-decoration:none;display:inline-flex;align-items:center;gap:4px}
.idea .ib button.added{background:#E4F3EB;color:#2C7F63}
.feed .fnote{font-size:10.5px;color:var(--sub);margin-top:10px;line-height:1.6}
/* AIの追加確認カード */
.tcard{align-self:stretch;background:var(--card);border:1.5px solid var(--accent2);border-radius:16px;
  padding:14px;box-shadow:var(--sh)}
.tcard .th{font-size:11.5px;font-weight:800;color:var(--accent2);margin-bottom:9px}
.tprev{background:var(--bg2);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.tp-k{font-size:10.5px;font-weight:800;color:var(--sub)}
.tp-t{font-size:14px;font-weight:800;margin-top:2px;line-height:1.5}
.tp-s{font-size:11.5px;color:var(--sub);margin-top:2px}
.tcard .tb{display:flex;gap:8px;margin-top:4px}
.tcard .tb button{flex:1;justify-content:center}
.hist-btn{width:100%;padding:11px;border-radius:14px;background:var(--card);box-shadow:var(--sh);
  font-size:13px;font-weight:800;color:var(--ink);margin-bottom:12px;display:flex;align-items:center;justify-content:center;gap:6px}
.lgd{display:flex;gap:14px;justify-content:center;margin:2px 0 8px;font-size:12px;font-weight:700;color:var(--sub)}
.lgd i{width:10px;height:10px;border-radius:50%;display:inline-block;margin-right:5px;vertical-align:-1px}
.pickbox{background:var(--bg2);border-radius:14px;padding:12px;margin-top:10px;font-size:13px;line-height:1.6}
.mstat{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.mstat div{background:var(--bg2);border-radius:12px;padding:9px;text-align:center;font-size:11px;color:var(--sub)}
.mstat b{display:block;font-size:16px;color:var(--ink)}
.mrow{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}
.mrow.on{background:var(--bg2);border-radius:12px;padding:10px 8px}
.mrow .e{font-size:24px;line-height:1.1;flex-shrink:0;width:30px;text-align:center}

/* ---------- HERO ---------- */
.hero{background:linear-gradient(135deg,#FF9A76,#FF7C6B 45%,#F2668D);color:#fff;border-radius:24px;padding:20px;
  box-shadow:0 10px 26px rgba(255,124,107,.34);margin-bottom:12px;position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;width:190px;height:190px;border-radius:50%;background:rgba(255,255,255,.13);right:-64px;top:-84px}
.hero .lb{font-size:11px;font-weight:800;opacity:.92;display:flex;align-items:center;gap:5px}
.cd{display:flex;align-items:flex-end;gap:4px;margin:6px 0 2px;position:relative}
.cd b{font-size:38px;font-weight:800;line-height:1}
.cd span{font-size:13px;font-weight:700;margin-bottom:5px;opacity:.95}
.hero .dt{font-size:12px;opacity:.92}
.hero hr{border:none;border-top:1px solid rgba(255,255,255,.28);margin:14px 0 12px}
.anv{display:flex;align-items:baseline;gap:6px;position:relative}
.anv b{font-size:26px;font-weight:800}
.next-mile{font-size:11px;opacity:.9;margin-top:3px;position:relative}
.q-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:12px}
.q{background:var(--card);border-radius:16px;box-shadow:var(--sh);padding:13px;text-align:left}
.q .t{font-size:11px;color:var(--sub);font-weight:700;display:flex;align-items:center;gap:4px}
.q .v{font-size:19px;font-weight:800;margin-top:3px}
.q .s{font-size:10px;color:var(--sub)}

/* ---------- MONEY ---------- */
.sum{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}
.sum div{background:var(--bg2);border-radius:14px;padding:10px;text-align:center}
.sum b{display:block;font-size:16px;font-weight:800}
.settle{background:linear-gradient(120deg,var(--bg2),transparent);border:1.5px dashed var(--line);border-radius:16px;
  padding:13px;text-align:center;font-size:14px;font-weight:800;line-height:1.7}
.settle .amt{font-size:22px;color:var(--accent)}
.navmonth{display:flex;align-items:center;justify-content:center;gap:14px;margin-bottom:10px}
.navmonth b{font-size:15px;font-weight:800;min-width:118px;text-align:center}
.navmonth button{width:34px;height:34px;font-size:18px;border-radius:50%;background:var(--card);box-shadow:var(--sh);display:flex;align-items:center;justify-content:center}
.amt-r{font-weight:800;font-size:15px;white-space:nowrap}
.balcard{background:linear-gradient(135deg,#2F8A6B,#3FA98A);color:#fff;border-radius:var(--r);
  padding:16px;margin-bottom:12px;box-shadow:0 8px 22px rgba(47,138,107,.28)}
.balcard .hd{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:800;opacity:.95}
.balcard .eye{margin-left:auto;width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.2);
  display:flex;align-items:center;justify-content:center;color:#fff;font-size:15px}
.balcard .big{font-size:30px;font-weight:800;letter-spacing:.5px;margin:6px 0 2px;font-variant-numeric:tabular-nums}
.balcard .sub{font-size:11px;opacity:.92;line-height:1.7}
.balcard .hid{letter-spacing:4px}
.dep{color:#2C7F63}

/* ---------- CALENDAR ---------- */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.cal .wd{text-align:center;font-size:10px;font-weight:800;color:var(--sub);padding-bottom:4px}
.cal .wd.s{color:var(--k)} .cal .wd.n{color:var(--accent)}
.cel{aspect-ratio:1/1.06;border-radius:11px;display:flex;flex-direction:column;align-items:center;padding-top:5px;
  font-size:12px;font-weight:700;position:relative;transition:.12s}
.cel.out{opacity:.28}
.cel.today{background:var(--bg2)}
.cel.sel{background:var(--ink);color:var(--bg)}
.cel .dots{display:flex;gap:2px;margin-top:3px}
.cel .dots i{width:5px;height:5px;border-radius:50%;display:block}
.evline{display:flex;align-items:center;gap:9px;padding:11px 0;border-bottom:1px solid var(--line)}
.evline:last-child{border-bottom:none}
.evbar{width:4px;align-self:stretch;border-radius:99px;flex-shrink:0}
.date-tag{width:46px;flex-shrink:0;text-align:center}
.date-tag b{display:block;font-size:17px;font-weight:800;line-height:1.1}
.date-tag span{font-size:10px;color:var(--sub)}

/* ---------- CHORE ---------- */
.chk{width:26px;height:26px;border-radius:9px;border:2px solid var(--line);flex-shrink:0;display:flex;
  align-items:center;justify-content:center;color:transparent;font-size:14px;transition:.18s;margin-top:1px}
.chk.on{background:var(--ok);border-color:var(--ok);color:#fff}
.chk.pop{animation:pop .42s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{0%{transform:scale(1)}45%{transform:scale(1.32) rotate(9deg)}100%{transform:scale(1)}}
.done-t{text-decoration:line-through;color:var(--sub)}
.prog{height:9px;border-radius:99px;background:var(--bg2);overflow:hidden;margin-top:9px}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--ok),#8ED9BF);border-radius:99px;transition:width .5s}

/* ---------- WISH ---------- */
.wgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.wcard{background:var(--card);border-radius:18px;box-shadow:var(--sh);padding:13px;display:flex;flex-direction:column;
  gap:6px;position:relative;overflow:hidden;transition:.2s}
.wcard.done{opacity:.62}
.wcard.done .wt{text-decoration:line-through}
.wt{font-size:14px;font-weight:800;line-height:1.4}
.wcard .gen{font-size:16px}
.stars{color:var(--accent2);font-size:11px;letter-spacing:1px}
.wcard a{color:var(--k);font-size:11px;font-weight:700;text-decoration:none;display:inline-flex;align-items:center;gap:3px}
.wbtn{margin-top:auto;padding:7px;border-radius:11px;background:var(--bg2);color:var(--sub);font-size:11px;font-weight:800;width:100%}
.wbtn.go{background:var(--ok);color:#fff}
.cheer{animation:cheer .6s}
@keyframes cheer{0%{transform:scale(1)}30%{transform:scale(1.07) rotate(-2deg)}60%{transform:scale(.98) rotate(1deg)}100%{transform:scale(1)}}

/* ---------- RULES ---------- */
.note{border-radius:18px;padding:15px;margin-bottom:11px;box-shadow:var(--sh);position:relative;color:#4A3B33}
.note .tx{font-size:15px;font-weight:700;line-height:1.65;white-space:pre-wrap;word-break:break-word}
.note .ft{display:flex;align-items:center;gap:6px;margin-top:10px;font-size:10px;opacity:.8}
.note .iact button{color:#4A3B33}

/* ---------- SHEET / MODAL ---------- */
.mask{position:fixed;inset:0;background:rgba(40,25,30,.44);z-index:100;opacity:0;transition:.22s;backdrop-filter:blur(2px)}
.mask.on{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:101;background:var(--card);border-radius:26px 26px 0 0;
  padding:8px 18px calc(24px + env(safe-area-inset-bottom));max-height:92dvh;overflow-y:auto;overflow-x:hidden;
  transform:translateY(102%);transition:transform .3s cubic-bezier(.2,.9,.3,1);max-width:620px;margin:0 auto}
.sheet.on{transform:none}
.grab{width:40px;height:4px;border-radius:99px;background:var(--line);margin:8px auto 14px}
.sheetx{position:absolute;right:14px;top:12px;width:32px;height:32px;border-radius:50%;
  background:var(--bg2);color:var(--sub);font-size:15px;font-weight:700;z-index:2;
  display:flex;align-items:center;justify-content:center}
.sheetx:active{background:var(--line)}
.sheet h3{margin:0 0 14px;font-size:17px;font-weight:800;display:flex;align-items:center;gap:7px}
label.f{display:block;margin-bottom:12px}
label.f>span{display:block;font-size:11px;font-weight:800;color:var(--sub);margin-bottom:5px}
.inp{width:100%;max-width:100%;min-width:0;display:block;padding:12px 13px;border-radius:13px;
  border:1.5px solid var(--line);background:var(--bg);outline:none;
  -webkit-appearance:none;appearance:none;font-variant-numeric:tabular-nums}
input[type=date].inp,input[type=time].inp,input[type=datetime-local].inp{
  min-height:46px;line-height:1.2;text-align:left}
input[type=date].inp::-webkit-date-and-time-value,
input[type=time].inp::-webkit-date-and-time-value{text-align:left;margin:0}
.inp:focus{border-color:var(--accent)}
textarea.inp{min-height:88px;resize:vertical;line-height:1.6}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:1 1 0;min-width:64px;padding:11px 4px;border-radius:13px;background:var(--bg);
  border:1.5px solid var(--line);font-size:13px;font-weight:700;color:var(--sub);white-space:nowrap}
.seg.sw button{min-width:40px;flex:1 1 40px}
.seg button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.sheet .btn{width:100%;justify-content:center;padding:14px;font-size:15px;margin-top:6px}

const USERS={

const LS_DATA='couple_home_data_v1', LS_USER='couple_home_user_v1', LS_CLOUD='couple_home_cloud_v1';
/* ふたり専用の同期設定（設定済み・触らなくてOK） */

};
const SAMPLE_CM=['仕事終わった！今週もおつかれさま','ちょっと眠いけど元気だよ'];
const BUILTIN_CLOUD={
  /* ルームID（＝ふたりの鍵）はここには書かない。URL末尾の #k=... から受け取る */
  config:{
    /* Firebaseのウェブ用キー（公開前提の識別子）。
       GitHubの秘密情報スキャンに毎回ひっかからないよう、分割して組み立てています。
       実際の保護は Firestore のルールと、ファイルに含めていないルームIDが担っています。 */
    apiKey:['AIzaSy','CiLf5Ei7A9Qh','CIYrE6Nlx','Pxupvw408ku4'].join(''),

    projectId:"futari-no-ouchi",

    messagingSenderId:"752099864139",
    appId:"1:752099864139:web:e976df1670dc1235b627ce"
  }
};
const EXP_CAT=['食費','外食','交通','娯楽','日用品','プレゼント','その他'];
const EV_CAT={date:{l:'デート',c:'#FF7C6B'},personal:{l:'個人予定',c:'#5B94D6'},anniv:{l:'記念日',c:'#E8A33D'},other:{l:'その他',c:'#8D8189'},payday:{l:'給料日',c:'#2C7F63'}};
const EV_PICK=[{v:'date',l:'デート'},{v:'personal',l:'個人予定'},{v:'anniv',l:'記念日'},{v:'other',l:'その他'}];
const WISH_GEN={trip:{l:'旅行',e:'✈️'},food:{l:'外食',e:'🍽'},movie:{l:'映画',e:'🎬'},shop:{l:'買い物',e:'🛍'},other:{l:'その他',e:'✨'}};
const FREQ=['毎日','週2〜3','毎週','毎月','不定期'];
const MOOD_CM=['仕事終わった！','お腹すいた','ちょっと疲れた','会いたいなあ','今日は最高！','ねむい…','がんばってる','癒やされたい'];
const NOTE_BG=['#FFE9D6','#FFDCE2','#DFF1E8','#E3ECFB','#F1E6FA','#FFF3C4'];

let ME=null, S=null, saveTimer=null, freshInstall=false;
const ui={tab:'home',month:null,calCur:null,calSel:null,calMode:'month',choreF:'all',wishF:'all',showBal:false};

/* ---------- utils ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const yen=n=>'¥'+Math.round(n).toLocaleString('ja-JP');
const pad2=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate());
const todayY=()=>ymd(new Date());
const pYMD=s=>{const[a,b,c]=String(s).split('-').map(Number);return new Date(a,b-1,c);};
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x;};
const uname=id=>USERS[id]?USERS[id].name:'ふたり';
/* 予定の終了日（未設定なら開始日と同じ）と、ある日がその期間に含まれるか */
const evEnd=e=>(e.end&&e.end>e.date)?e.end:e.date;
const evCovers=(e,d)=>d>=e.date&&d<=evEnd(e);
const evCat=e=>EV_CAT[e&&e.cat]||EV_CAT.other;
const wGen=w=>WISH_GEN[w&&w.gen]||WISH_GEN.other;
const safeUrl=u=>/^https?:\/\//i.test(String(u||''))?String(u):'';
const wPri=w=>Math.min(3,Math.max(1,Number(w&&w.pri)||2));
const evDays=e=>Math.round((pYMD(evEnd(e))-pYMD(e.date))/864e5)+1;
function relTime(ts){
  if(!ts)return'';
  const m=Math.floor((Date.now()-ts)/60000);
  if(m<1)return'たった今'; if(m<60)return m+'分前';
  const h=Math.floor(m/60); if(h<24)return h+'時間前';
  const d=Math.floor(h/24); if(d===1)return'昨日'; if(d<7)return d+'日前';
  const t=new Date(ts); return (t.getMonth()+1)+'月'+t.getDate()+'日';
}
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('on');clearTimeout(t._x);t._x=setTimeout(()=>t.classList.remove('on'),2100);}
function icons(){try{lucide.createIcons()}catch(e){}}
function badge(id,label){
  if(!id||!USERS[id])return`<span class="badge both">${esc(label||'ふたり')}</span>`;
  return`<span class="badge ${id}">${USERS[id].emoji}${esc(label||USERS[id].name)}</span>`;
}
function editedBy(o){
  const u=o&&USERS[o.lastModifiedBy];
  return u ? `<span class="badge ${o.lastModifiedBy}" title="最終更新者">${u.emoji}${u.name}が更新・${relTime(o.updatedAt)}</span>` : '';
}
function touch(o){ o.updatedAt=Date.now(); o.lastModifiedBy=ME; return o; }
/* 編集しようとした項目が、その間に相手に消されていないか */
function pick(key,id){
  const o=(S[key]||[]).find(x=>x.id===id);
  if(!o||o.deleted){ toast('この項目は削除されています'); closeSheet(); render(); return null; }
  return o;
}

/* ---------- mood helpers ---------- */
function moodEmoji(v){ return v>=8?'🤩':v>=5?'😄':v>=2?'🙂':v>=-1?'😐':v>=-4?'😕':v>=-7?'😢':'😭'; }
function moodWord(v){ return v>=8?'すごいいい気分':v>=5?'ごきげん':v>=2?'まあまあ元気':v>=-1?'ふつう':v>=-4?'ちょっと疲れた':v>=-7?'かなりしんどい':'すごく悲しい'; }
function moodColor(v){ const t=(Number(v)+10)/20; return `hsl(${210-172*t} ${58+24*t}% ${52+4*t}%)`; }

/* ---------- storage ---------- */
function saveLocal(){ try{localStorage.setItem(LS_DATA,JSON.stringify(S))}catch(e){} }
function save(opts){
  saveLocal();
  clearTimeout(saveTimer); saveTimer=setTimeout(()=>Cloud.push(),700);
  if(!opts||opts.render!==false) render();
}
function loadLocal(){ try{const r=localStorage.getItem(LS_DATA); return r?JSON.parse(r):null;}catch(e){return null;} }

/* ---------- sample data ---------- */
function seed(){
  const now=Date.now();
  return {
    v:1,
    schema:SCHEMA,
    settings:{anniversary:'2024-06-02', jointInit:500000,
      payday:{on:true,day:25,shiftWeekend:true,label:'給料日'},
      ai:{url:'',secret:'',name:'AI',persona:'',sendPlans:true,sendMood:true,sendMoney:false,rate:160},
      updatedAt:now, lastModifiedBy:'keisuke'},
    moods:{
      keisuke:{value:0,comment:'',updatedAt:0,lastModifiedBy:'keisuke'},
      kotomi :{value:0,comment:'',updatedAt:0,lastModifiedBy:'kotomi'}
    },
    expenses:[], events:[], chores:[], wishes:[], rules:[], payouts:[], moodLog:[], ledger:[], chat:[], aiLog:[]
  };
}
function ensure(s){
  const base=seed();
  if(!s)return base;
  ['expenses','events','chores','wishes','rules','payouts','moodLog','ledger','chat','aiLog'].forEach(k=>{ if(!Array.isArray(s[k]))s[k]=[]; });
  s.schema=Math.max(Number(s.schema)||1,SCHEMA);
  s.settings=Object.assign({},base.settings,s.settings||{});
  s.settings.payday=Object.assign({},base.settings.payday,s.settings.payday||{});
  /* v2.3：家計簿 → 共同口座の通帳へ移行 */
  (function(){
    const have=new Set(s.ledger.map(x=>x.id));
    const add=(src,o)=>{ const id='m_'+src.id; if(have.has(id))return;
      s.ledger.push(Object.assign({id,deleted:!!src.deleted,updatedAt:src.updatedAt||Date.now(),
        lastModifiedBy:src.lastModifiedBy||'keisuke',who:'',cat:'',paidBy:'',reim:'',to:''},o)); have.add(id); };
    (s.expenses||[]).forEach(e=>{
      const base={date:e.date,title:e.title,amount:e.amount};
      if(e.split==='joint'&&e.payer!=='joint')      add(e,Object.assign({type:'in',who:e.payer},base));
      else if(e.payer==='joint')                    add(e,Object.assign({type:'out',paidBy:'joint',cat:e.cat},base));
      else if(e.reim==='wait'||e.reim==='done')     add(e,Object.assign({type:'out',paidBy:e.payer,reim:e.reim,cat:e.cat},base));
      else                                          add(e,Object.assign({type:'personal',cat:e.cat},base));
    });
    (s.payouts||[]).forEach(q=>add(q,{type:'back',to:q.to,date:q.date,title:q.memo||'払い戻し',amount:q.amount}));
    /* 移行済みの元データには削除マークを付ける（相手の端末にも伝わる） */
    const nw=Date.now();
    (s.expenses||[]).forEach(e=>{ if(!e.deleted){e.deleted=true;e.updatedAt=nw;} });
    (s.payouts||[]).forEach(q=>{ if(!q.deleted){q.deleted=true;q.updatedAt=nw;} });
  })();
  if(s.settings.jointInit===undefined)s.settings.jointInit=500000;
  s.settings.ai=Object.assign({},base.settings.ai,s.settings.ai||{});
  s.moods=Object.assign({},base.moods,s.moods||{});
  /* 既存の「いまの気分」を履歴の最初の1件として引き継ぐ（初回のみ） */
  if(!s.moodLog.length){
    ['keisuke','kotomi'].forEach(u=>{ const m=s.moods[u];
      if(m&&m.updatedAt) s.moodLog.push({id:'seed_'+u,who:u,v:Number(m.value)||0,cm:m.comment||'',
        at:m.updatedAt,updatedAt:m.updatedAt,lastModifiedBy:u,deleted:false}); });
  }
  /* 会話とAI利用の記録は、増えすぎるとクラウドに収まらなくなるので上限をつける */
  const trim=(k,keep)=>{
    const arr=s[k].filter(x=>!x.deleted).sort((a,b)=>(b.at||b.updatedAt||0)-(a.at||a.updatedAt||0));
    if(arr.length>keep){ const nw2=Date.now();
      arr.slice(keep).forEach(x=>{ x.deleted=true; x.updatedAt=nw2; }); }
  };
  trim('chat',300); trim('aiLog',800);
  /* 400日より古い記録は削除マークを付ける（相手の端末にも伝わる） */
  const oldCut=Date.now()-400*864e5, nw=Date.now();
  s.moodLog.forEach(m=>{ if(!m.deleted&&m.at<oldCut){ m.deleted=true; m.updatedAt=nw; } });
  return s;
}

/* ---------- merge (last-write-wins per item) ---------- */
function mergeArr(local,remote){
  const map=new Map(); (local||[]).forEach(x=>map.set(x.id,x));
  (remote||[]).forEach(r=>{ const l=map.get(r.id);
    if(!l || (r.updatedAt||0)>(l.updatedAt||0)) map.set(r.id,r); });
  return [...map.values()];
}
let schemaWarn=false;
const ARRAYS=['expenses','events','chores','wishes','rules','payouts','moodLog','ledger','chat','aiLog'];
/* 戻り値 true ＝ こちらにしかない情報があるので、クラウドへ押し戻す必要がある */
function mergeState(remote){
  if(!remote)return false;
  /* 相手がこちらの知らない形式を使っていたら警告（データは触らない） */
  if(Number(remote.schema||1)>SCHEMA){ schemaWarn=true; setTimeout(showUpdBar,50); }
  let need=false;
  ARRAYS.forEach(k=>{
    const rid=new Set((remote[k]||[]).map(x=>x&&x.id));
    S[k]=mergeArr(S[k],remote[k]);
    if(S[k].some(x=>!rid.has(x.id))) need=true;      /* 相手が知らない項目がこちらにある */
  });
  ['keisuke','kotomi'].forEach(u=>{
    const r=remote.moods&&remote.moods[u]; if(r&&(r.updatedAt||0)>(S.moods[u].updatedAt||0)) S.moods[u]=r;
  });
  ['keisuke','kotomi'].forEach(u=>{
    if((S.moods[u].updatedAt||0)>(((remote.moods||{})[u]||{}).updatedAt||0)) need=true;
  });
  if(remote.settings&&(remote.settings.updatedAt||0)>(S.settings.updatedAt||0)){
    /* 既定値を保ったまま差し替える（jointInit などが消えないように） */
    const base=seed().settings;
    S.settings=Object.assign({},base,remote.settings,
      {payday:Object.assign({},base.payday,remote.settings.payday||{}),
       ai:Object.assign({},base.ai,remote.settings.ai||{})});
  }else if((S.settings.updatedAt||0)>((remote.settings||{}).updatedAt||0)) need=true;
  // 30日以上前の削除済みを掃除
  const cut=Date.now()-30*864e5;
  ARRAYS.forEach(k=>{ S[k]=S[k].filter(x=>!(x.deleted&&(x.updatedAt||0)<cut)); });
  return need;
}
const live=k=>(S[k]||[]).filter(x=>!x.deleted);

/* ---------- cloud sync (Firebase Firestore / optional) ---------- */
const Cloud={
  cfg:null, ready:false, status:'off', lastPushId:null, _db:null, _fs:null, _unsub:null,
  conf(){ let c=null; try{c=JSON.parse(localStorage.getItem(LS_CLOUD)||'null')}catch(e){}
    if(c&&c.off)return null;
    const room=(c&&c.room)||localStorage.getItem(LS_ROOM)||'';
    const config=(c&&c.config)||BUILTIN_CLOUD.config;
    if(!room||!config)return null;
    return {room,config}; },
  setConf(c){ if(c===null)localStorage.setItem(LS_CLOUD,JSON.stringify({off:true}));
    else if(c===undefined)localStorage.removeItem(LS_CLOUD);
    else localStorage.setItem(LS_CLOUD,JSON.stringify(c)); },
  dot(){ const d=$('#cloudDot');
    if(d)d.className='cloud-dot'+(this.status==='on'?' on':this.status==='err'?' err':'');
    updateSyncBar(); },
  async init(){
    if(this._busy)return;
    this._busy=true; try{ await this._init(); } finally{ this._busy=false; }
  },
  async _init(){
    const c=this.conf(); if(!c||!c.config||!c.room){ this.status='off'; this.dot(); return; }
    this.status='wait'; this.dot();
    try{
      const [app,fs]=await Promise.all([
        import('https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js'),
        import('https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js')
      ]);
      const a=app.getApps&&app.getApps().length?app.getApps()[0]:app.initializeApp(c.config);
      this._fs=fs; this._db=fs.getFirestore(a); this.cfg=c; this.ready=true;
      const ref=fs.doc(this._db,'couples',c.room);
      if(this._unsub)this._unsub();
      this.firstSnap=true;
      this._unsub=fs.onSnapshot(ref,snap=>{
        this.status='on'; this.dot();
        const d=snap.data();
        if(this.firstSnap){
          this.firstSnap=false;
          if(!d||!d.payload){ freshInstall=false; this.push(); return; }
          try{
            /* 初回でも丸ごと上書きはしない。受け取るまでに入力したものを失うため */
            const need=mergeState(JSON.parse(d.payload));
            freshInstall=false; saveLocal(); render(); toast('☁️ 同期しました');
            if(need) setTimeout(()=>this.push(),1200);
            setTimeout(offerSampleCleanup,600);
          }catch(e){}
          if(this._pending){ this._pending=false; this.push(); }
          return;
        }
        if(!d||!d.payload)return;
        if(d.pushId===this.lastPushId)return;
        try{
          const need=mergeState(JSON.parse(d.payload));
          saveLocal(); render(); toast('☁️ 相手の更新を受け取りました');
          if(need) setTimeout(()=>this.push(),1200);   /* こちらにしかない分を押し戻す */
        }catch(e){}
      },err=>{ this.status='err'; this.dot(); toast('同期エラー: '+err.code); });

      /* 毎週のおすすめは、本体とは別の場所を見る（本体を上書きしないため） */
      if(this._unsubF)this._unsubF();
      this._unsubF=fs.onSnapshot(fs.doc(this._db,'feeds',c.room),snap=>{
        const d=snap.data(); if(!d||!d.payload)return;
        try{ FEED=JSON.parse(d.payload); localStorage.setItem(LS_FEED,d.payload); render(); }catch(e){}
      },()=>{});
    }catch(e){ this.status='err'; this.dot(); toast('📴 オフラインです。この端末に保存しています'); }
  },
  async push(){
    if(!this.ready)return;
    if(this.firstSnap){ this._pending=true; return; }
    try{
      this.lastPushId=uid();
      await this._fs.setDoc(this._fs.doc(this._db,'couples',this.cfg.room),
        {payload:JSON.stringify(S),pushId:this.lastPushId,at:Date.now(),by:ME});
      this.status='on'; this.dot();
    }catch(e){
      this.status='err'; this.dot();
      if(String(e&&e.message||'').match(/longer than|exceeds|too large/i))
        toast('データが大きすぎて保存できません。設定から書き出して相談してください');
    }
  },
  stop(){ if(this._unsub)this._unsub(); this._unsub=null;
    if(this._unsubF)this._unsubF(); this._unsubF=null;
    this.ready=false; this.status='off'; this.dot(); }
};

  const prev=new Date(); prev.setDate(1); prev.setMonth(prev.getMonth()-1);
  const prevYM=ym(prev);
  const z=()=>({in:0,out:0,n:0});

  live('aiLog').forEach(r=>{
    const add=t=>{t.in+=Number(r.in)||0;t.out+=Number(r.out)||0;t.n++;};

    if(y===thisYM)add(acc.cur); else if(y===prevYM)add(acc.last);
  });
  ['all','cur','last'].forEach(k=>{ acc[k].usd=cost(acc[k]); acc[k].jpy=acc[k].usd*rate; });

function buildMsgs(){

  hist.forEach(m=>{
    const role=m.role==='ai'?'assistant':'user';

    if(out.length&&out[out.length-1].role===role) out[out.length-1].content+='\n'+text;

function fitChat(){

function chatGrow(t){ t.style.height='auto'; t.style.height=Math.min(132,t.scrollHeight)+'px'; }
function chatNearBottom(){

function chatToBottom(smooth){

function renderChat(force){

function toolPreview(u){
  const i=u.input||{};
  if(u.name==='add_event'){
    const c=EV_CAT[i.cat]||EV_CAT.other;
    return `<div class="tprev"><div class="tp-k">📅 カレンダーに追加</div>
      <div class="tp-t">${esc(i.title||'')}</div>
      <div class="tp-s">${esc(i.date||'')}${(i.end&&i.end>i.date)?' 〜 '+esc(i.end):''}${i.time?' '+esc(i.time):''} ・ ${c.l}</div>
      ${i.memo?`<div class="tp-s">${esc(i.memo)}</div>`:''}</div>`;
  }
  const g=WISH_GEN[i.gen]||WISH_GEN.other;
  const pri=Math.min(3,Math.max(1,Number(i.pri)||2));
  return `<div class="tprev"><div class="tp-k">💗 やりたいことに追加</div>
    <div class="tp-t">${esc(i.title||'')}</div>

function toolCardHTML(){
  if(!pendingTool)return '';
  return `<div class="tcard"><div class="th">この内容で追加していい？</div>
    ${pendingTool.uses.map(toolPreview).join('')}
    <div class="tb"><button class="btn line" onclick="toolConfirm(false)">やめる</button>
      <button class="btn" onclick="toolConfirm(true)">追加する</button></div></div>`;
}
function applyTools(uses){
  const done=[];
  uses.forEach(u=>{
    const i=u.input||{};
    if(u.name==='add_event'){
      const date=/^\d{4}-\d{2}-\d{2}$/.test(i.date||'')?i.date:todayY();
      const o={title:String(i.title||'予定').slice(0,60),date,
        end:(/^\d{4}-\d{2}-\d{2}$/.test(i.end||'')&&i.end>date)?i.end:'',
        time:/^\d{2}:\d{2}$/.test(i.time||'')?i.time:'',
        cat:EV_CAT[i.cat]?i.cat:'other',memo:String(i.memo||'').slice(0,120)};
      S.events.push(touch(Object.assign({id:uid(),deleted:false},o)));
      ui.calCur=o.date.slice(0,7); ui.calSel=o.date;   /* 追加した予定がすぐ見えるように */
      done.push(`「${o.title}」を ${Number(o.date.slice(5,7))}/${Number(o.date.slice(8))} の予定に`);
    }else if(u.name==='add_wish'){
      const o={title:String(i.title||'').slice(0,60),gen:WISH_GEN[i.gen]?i.gen:'other',
        pri:Math.min(3,Math.max(1,Number(i.pri)||2)),
        url:/^https?:\/\//.test(i.url||'')?i.url:'',done:false};
      if(!o.title)return;
      S.wishes.push(touch(Object.assign({id:uid(),deleted:false},o)));
      done.push(`「${o.title}」をやりたいことに`);
    }
  });
  return done;
}
async function toolConfirm(ok){
  const pt=pendingTool; if(!pt||aiBusy)return;
  pendingTool=null;
  let results;
  if(ok){
    const done=applyTools(pt.uses);
    S.chat.push(touch({id:uid(),role:'ai',who:'',text:'✅ '+done.join('、')+' 追加しました。',at:Date.now(),deleted:false}));
    results=pt.uses.map(u=>({type:'tool_result',tool_use_id:u.id,content:'追加しました'}));
    toast('追加しました');
  }else{
    S.chat.push(touch({id:uid(),role:'ai',who:'',text:'（追加はやめました）',at:Date.now(),deleted:false}));
    results=pt.uses.map(u=>({type:'tool_result',tool_use_id:u.id,
      content:'ユーザーが追加を断りました。実際には追加されていません。'}));
  }
  save(); renderChat(true);                 /* 予定・Wishを足したので裏の画面も描き直す */
  aiBusy=true; renderChat(true);
  try{
    const a=S.settings.ai||{};
    const r=await fetch(a.url,{method:'POST',headers:{'content-type':'application/json'},
      body:JSON.stringify({secret:a.secret,system:aiSystem(),useTools:true,
        messages:pt.history.concat([{role:'assistant',content:pt.raw},{role:'user',content:results}])})});
    const d=await r.json().catch(()=>({}));
    if(!r.ok||d.error)throw new Error(d.error||('HTTP '+r.status));
    if(d.text) S.chat.push(touch({id:uid(),role:'ai',who:'',text:d.text,at:Date.now(),deleted:false}));
    if(d.usage) S.aiLog.push(touch({id:uid(),at:Date.now(),in:Number(d.usage.in)||0,out:Number(d.usage.out)||0,deleted:false}));
    save({render:false});
  }catch(e){ toast('AIエラー：'+(e.message||'')); }
  aiBusy=false; renderChat(true);
}
async function aiSend(preset){
  if(aiBusy)return;
  const inp=$('#chatIn');
  const text=(preset||inp.value).trim();
  if(!text)return;
  const a=S.settings.ai||{};
  if(!a.url||!a.secret){ toast('先に設定でAIの接続情報を入れてね'); return; }
  if(!preset){ inp.value=''; chatGrow(inp); }
  const now=Date.now(), myId=uid();
  S.chat.push(touch({id:myId,role:'user',who:ME,text,at:now,deleted:false}));
  saveLocal(); clearTimeout(saveTimer); saveTimer=setTimeout(()=>Cloud.push(),700);
  aiBusy=true; pendingTool=null; renderChat(true);
  const history=buildMsgs();
  try{
    const r=await fetch(a.url,{method:'POST',headers:{'content-type':'application/json'},
      body:JSON.stringify({secret:a.secret,system:aiSystem(),useTools:true,messages:history})});
    const d=await r.json().catch(()=>({error:'返事を読み取れませんでした'}));
    if(!r.ok||d.error) throw new Error(d.error||('HTTP '+r.status));
    const uses=(d.content||[]).filter(c=>c.type==='tool_use');
    if(d.text) S.chat.push(touch({id:uid(),role:'ai',who:'',text:d.text,at:Date.now(),deleted:false}));
    if(uses.length) pendingTool={uses,raw:d.content,history};
    else if(!d.text) S.chat.push(touch({id:uid(),role:'ai',who:'',text:'（返答が空でした）',at:Date.now(),deleted:false}));
    if(d.usage) S.aiLog.push(touch({id:uid(),at:Date.now(),
      in:Number(d.usage.in)||0,out:Number(d.usage.out)||0,deleted:false}));
    save({render:false});
  }catch(e){
    /* 送れなかった発言は取り消して、書いた文章を入力欄に戻す */
    const mine=S.chat.find(m=>m.id===myId);
    if(mine){ mine.deleted=true; touch(mine); save({render:false}); }
    if(!preset){ inp.value=text; chatGrow(inp); }
    toast('AIエラー：'+(e.message||'接続できませんでした'));
  }
  aiBusy=false; renderChat(true);
}

/* ================== 気分の記録（グラフ＋一覧） ================== */
function moodEntries(days){
  const from=days?Date.now()-days*864e5:0;
  return live('moodLog').filter(m=>m.at>=from).sort((a,b)=>a.at-b.at);
}
function moodChart(all){
  const W=320,H=178,L=25,R=13,T=10,B=20;
  let from=ui.moodRange?Date.now()-ui.moodRange*864e5:Math.min(...all.map(m=>m.at));
  let to=Date.now();
  if(to-from<6*36e5) from=to-6*36e5;
  const X=t=>L+(W-L-R)*((t-from)/(to-from));
  const Y=v=>T+(H-T-B)*((10-Math.max(-10,Math.min(10,v)))/20);
  let g='';
  /* 気分の正負がひと目で分かるように、0を境にごく淡い帯を敷く */
  g+=`<rect x="${L}" y="${Y(10)}" width="${W-L-R}" height="${Y(0)-Y(10)}" fill="#F59A4B" opacity=".07"/>`;
  g+=`<rect x="${L}" y="${Y(0)}" width="${W-L-R}" height="${Y(-10)-Y(0)}" fill="#5B94D6" opacity=".07"/>`;
  [10,5,0,-5,-10].forEach(v=>{
    g+=`<line x1="${L}" y1="${Y(v)}" x2="${W-R}" y2="${Y(v)}" stroke="var(--ch-grid)" stroke-width="${v===0?1.5:1}"${v===0?'':' stroke-dasharray="2 3"'}/>`;
    g+=`<text x="${L-4}" y="${Y(v)+3}" text-anchor="end" font-size="8" fill="var(--sub)">${v>0?'+':''}${v}</text>`;
  });
  for(let i=0;i<=4;i++){ const t=from+(to-from)*i/4, d=new Date(t);
    g+=`<text x="${X(t)}" y="${H-5}" text-anchor="${i===0?'start':i===4?'end':'middle'}" font-size="8" fill="var(--sub)">${d.getMonth()+1}/${d.getDate()}</text>`; }
  const pts_=[], labels=[];
  ['keisuke','kotomi'].forEach((who,wi)=>{
    const pts=all.filter(m=>m.who===who); if(!pts.length)return;
    const col=who==='keisuke'?'var(--ch-k)':'var(--ch-ko)';
    if(pts.length>1) g+=`<polyline fill="none" stroke="${col}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" points="${pts.map(m=>X(m.at).toFixed(1)+','+Y(m.v).toFixed(1)).join(' ')}"/>`;
    /* 点が詰まっているときは線を主役にし、丸は選択中と最新だけ描く */
    const dense=pts.length>18;
    pts.forEach((m,i)=>{
      const sel=ui.moodSel===m.id;
      if(!dense||sel||i===pts.length-1)
        g+=`<circle cx="${X(m.at).toFixed(1)}" cy="${Y(m.v).toFixed(1)}" r="${sel?6:4}" fill="${col}" stroke="var(--card)" stroke-width="2"/>`;
      pts_.push({id:m.id,x:X(m.at),y:Y(m.v)});
    });
    const last=pts[pts.length-1];
    labels.push({x:Math.min(X(last.at)+6,W-3), y:Y(last.v)+(wi?13:-9), name:USERS[who].name});
  });
  /* ラベル同士が重ならないよう、11px以上離す */
  labels.sort((a,b)=>a.y-b.y);
  for(let i=1;i<labels.length;i++) if(labels[i].y-labels[i-1].y<11) labels[i].y=labels[i-1].y+11;
  const shift=Math.max(0,labels.length?labels[labels.length-1].y-(H-B-2):0);
  labels.forEach(l=>{
    g+=`<text x="${l.x}" y="${Math.max(T+8,l.y-shift)}" text-anchor="end" font-size="9" font-weight="700"
      fill="var(--ink)" stroke="var(--card)" stroke-width="3" paint-order="stroke" stroke-linejoin="round">${l.name}</text>`;
  });

  /* 点が密でも確実に選べるよう、面全体で受けて一番近い点を拾う */
  window._mpts=pts_;
  const hit=`<rect x="0" y="0" width="${W}" height="${H}" fill="transparent" style="cursor:pointer" onclick="pickNearest(event)"/>`;
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block;touch-action:manipulation" role="img"
    aria-label="けいすけとことみの気分の推移グラフ。縦軸は-10から+10。下の一覧に同じ内容を文字で載せています。">${g}${hit}</svg>`;
}

function pickNearest(ev){
  const svg=ev.currentTarget.ownerSVGElement, r=svg.getBoundingClientRect(), vb=svg.viewBox.baseVal;
  const x=(ev.clientX-r.left)/r.width*vb.width, y=(ev.clientY-r.top)/r.height*vb.height;
  let best=null,bd=1e9;
  (window._mpts||[]).forEach(pt=>{ const d=(pt.x-x)*(pt.x-x)+(pt.y-y)*(pt.y-y)*0.45;
    if(d<bd){bd=d;best=pt;} });
  if(best){ ui.moodSel=best.id; renderMoodBody(); }
}

/* 実質の支払元。共同口座から返金する（予定・済み）ものは共同口座払いとみなす */
/* 給料日（毎月◯日。土日ならその前の金曜日へ） */
function paydayDate(y,m){
  const c=S.settings.payday||{};
  const last=new Date(y,m+1,0).getDate();
  const d=new Date(y,m,Math.min(Math.max(1,Number(c.day)||25),last));
  if(c.shiftWeekend!==false) while(d.getDay()===0||d.getDay()===6) d.setDate(d.getDate()-1);
  return d;
}
function paydaysBetween(fromY,toY){
  const c=S.settings.payday||{};
  if(c.on===false)return [];
  const out=[], f=pYMD(fromY), t=pYMD(toY);
  let d=new Date(f.getFullYear(),f.getMonth(),1);
  while(d<=t){
    const sd=ymd(paydayDate(d.getFullYear(),d.getMonth()));
    if(sd>=fromY&&sd<=toY) out.push({id:'pay-'+sd,date:sd,time:'',title:c.label||'給料日',
      cat:'payday',memo:'',virtual:true,end:''});
    d=new Date(d.getFullYear(),d.getMonth()+1,1);
  }
  return out;
}
/* ================== 共同口座の通帳 ==================
   ledger: {type:'in'|'out'|'back'|'personal', date, title, amount,
            who   … in のとき入れた人
            cat   … out のときカテゴリ
            paidBy… out のとき 'joint'|'keisuke'|'kotomi'
            reim  … out で立替のとき ''|'wait'|'done'
            to    … back のとき受け取った人 }                        */
const LED=()=>live('ledger');
function jointBalance(){
  const init=Number(S.settings.jointInit)||0;
  let inA=0,outA=0,back=0,pend=0;
  LED().forEach(x=>{
    const a=Number(x.amount)||0;
    if(x.type==='in') inA+=a;
    else if(x.type==='back') back+=a;
    else if(x.type==='out'){
      if(x.paidBy==='joint'||x.reim==='done') outA+=a;   /* 口座からお金が出た */
      else pend+=a;                                      /* 立替のまま。まだ出ていない */
    }
  });
  return {init,inA,outA,back,pend,bal:init+inA-outA-back};
}
function ledIcon(x){
  if(x.type==='in')   return `<span class="badge joint">🏦 入金</span>${badge(x.who,uname(x.who)+'から')}`;
  if(x.type==='back') return `<span class="badge joint">🏦 払い戻し</span>${badge(x.to,uname(x.to)+'へ')}`;
  return x.paidBy==='joint' ? '<span class="badge joint">🏦 口座から支払</span>'
       : badge(x.paidBy,uname(x.paidBy)+'が立替');
}

/* ============================ CALENDAR ============================ */
function renderCal(){
  let evs=live('events');
  let body;
  if(ui.calMode==='month'){
    const [y,m]=ui.calCur.split('-').map(Number);
    const first=new Date(y,m-1,1), start=addDays(first,-first.getDay());
    evs=evs.concat(paydaysBetween(ymd(start),ymd(addDays(start,41))));
    let cells='';
    for(let i=0;i<42;i++){
      const d=addDays(start,i), s=ymd(d), out=d.getMonth()!==m-1;
      const de=evs.filter(e=>evCovers(e,s));
      cells+=`<button class="cel ${out?'out':''} ${s===todayY()?'today':''} ${s===ui.calSel?'sel':''}" onclick="ui.calSel='${s}';render()">
        <span style="${d.getDay()===0?'color:var(--accent)':d.getDay()===6?'color:var(--k)':''}">${d.getDate()}</span>
        <span class="dots">${de.slice(0,3).map(e=>`<i style="background:${evCat(e).c}"></i>`).join('')}</span></button>`;
    }
    const sel=evs.filter(e=>evCovers(e,ui.calSel)).sort((a,b)=>(a.time||'99').localeCompare(b.time||'99'));
    const sd=pYMD(ui.calSel);
    body=`<div class="card">
      <div class="navmonth"><button onclick="mvCal(-1)"><i data-lucide="chevron-left"></i></button>
        <b>${y}年${m}月</b><button onclick="mvCal(1)"><i data-lucide="chevron-right"></i></button></div>
      <div class="cal">${['日','月','火','水','木','金','土'].map((w,i)=>`<div class="wd ${i===0?'n':i===6?'s':''}">${w}</div>`).join('')}${cells}</div>
    </div>
    <div class="card"><div class="sec-head"><h2>${sd.getMonth()+1}月${sd.getDate()}日（${'日月火水木金土'[sd.getDay()]}）の予定</h2></div>
      ${sel.length?sel.map(evLine).join(''):'<div class="empty"><div>🗓</div>この日の予定はありません</div>'}</div>`;
  }else{
    evs=evs.concat(paydaysBetween(ymd(addDays(new Date(),-120)),ymd(addDays(new Date(),400))));
    const up=evs.filter(e=>evEnd(e)>=todayY()).sort((a,b)=>a.date.localeCompare(b.date)||(a.time||'99').localeCompare(b.time||'99'));
    const past=evs.filter(e=>evEnd(e)<todayY()).sort((a,b)=>b.date.localeCompare(a.date)).slice(0,10);
    body=`<div class="card"><div class="sec-head"><h2><i data-lucide="calendar-clock"></i>これからの予定</h2></div>
      ${up.length?up.map(e=>evLine(e,true)).join(''):'<div class="empty"><div>🗓</div>予定がありません</div>'}</div>
      ${past.length?`<div class="card"><div class="sec-head"><h2 class="muted">過去の予定</h2></div>${past.map(e=>evLine(e,true)).join('')}</div>`:''}`;
  }
  $('#view-cal').innerHTML=
   `<div class="sec-head"><h2><i data-lucide="calendar-days"></i>共有カレンダー</h2>
      <button class="btn sm sp" onclick="evSheet()"><i data-lucide="plus"></i>予定を追加</button></div>
    <div class="chips">
      <button class="chip ${ui.calMode==='month'?'on':''}" onclick="ui.calMode='month';render()">月表示</button>
      <button class="chip ${ui.calMode==='list'?'on':''}" onclick="ui.calMode='list';render()">リスト表示</button>
      ${Object.entries(EV_CAT).map(([k,v])=>`<span class="chip" style="pointer-events:none"><i style="display:inline-block;width:7px;height:7px;border-radius:50%;background:${v.c};margin-right:5px"></i>${v.l}</span>`).join('')}
    </div>${body}`;
}
function evLine(e,showDate){
  const c=evCat(e); const d=pYMD(e.date);
  return `<div class="evline">
    <div class="evbar" style="background:${c.c}"></div>
    ${showDate?`<div class="date-tag"><b>${d.getDate()}</b><span>${d.getMonth()+1}月(${'日月火水木金土'[d.getDay()]})</span></div>`:''}
    <div style="min-width:0;flex:1">
      <div style="font-weight:700;font-size:14px">${e.time?`<span class="pill" style="margin-right:5px">${e.time}</span>`:''}${esc(e.title)}</div>
      ${evEnd(e)!==e.date?`<div class="muted" style="margin-top:2px">📅 ${Number(e.date.slice(5,7))}/${Number(e.date.slice(8))} 〜 ${Number(evEnd(e).slice(5,7))}/${Number(evEnd(e).slice(8))}（${evDays(e)}日間）</div>`:''}
      ${e.memo?`<div class="muted" style="margin-top:2px">${esc(e.memo)}</div>`:''}
      <div class="row" style="gap:5px;margin-top:5px;flex-wrap:wrap"><span class="pill" style="color:${c.c}">${c.l}</span>
        ${e.virtual?'<span class="pill">🔁 毎月くり返し</span>':editedBy(e)}</div>
    </div>
    <div class="iact">${e.virtual
      ? `<button onclick="openSettings()" title="給料日の設定"><i data-lucide="settings"></i></button>`
      : `<button onclick="evSheet('${e.id}')"><i data-lucide="pencil"></i></button>
         <button onclick="del('events','${e.id}','この予定')"><i data-lucide="trash-2"></i></button>`}</div></div>`;
}

function rSave(id){

function setSave(){
  S.settings=Object.assign({},S.settings,{
    anniversary:val('sAnv'),
    jointInit:Math.max(0,Number(val('sJoint'))||0),
    ai:Object.assign({},S.settings.ai,{url:val('aUrl'),secret:val('aSec'),
      rate:Math.max(1,Number(val('aRate'))||160),
      name:val('aName')||'AI',persona:document.getElementById('aPersona')?document.getElementById('aPersona').value.trim():'',
      sendPlans:segVal('aPlans')==='1',sendMood:segVal('aMood')==='1',sendMoney:segVal('aMoney')==='1'}),
    payday:Object.assign({},S.settings.payday,{on:segVal('payon')==='1',
      day:Math.min(31,Math.max(1,Number(val('sPayDay'))||25)),shiftWeekend:true,label:'給料日'}),
    updatedAt:Date.now(),lastModifiedBy:ME});
  closeSheet(); save(); toast('設定を保存しました');
}
function inviteURL(){
  const r=localStorage.getItem(LS_ROOM)||'';
  if(location.protocol==='file:')return '#k='+r;
  return location.origin+location.pathname+'#k='+r;
}
function copyInvite(){
  const u=inviteURL();
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(u).then(()=>toast('リンクをコピーしました')).catch(()=>toast('詳細設定からコピーしてね'));
  }else toast('詳細設定の「相手に送るリンク」から長押しでコピーしてね');
}
function cloudSave(){
  const room=val('cRoom'); if(!room){toast('同期キーを入力してね');return;}
  localStorage.setItem(LS_ROOM,room);
  const raw=document.getElementById('cCfg').value.trim();
  let cfg=null;
  if(raw){
    try{ const m=raw.match(/\{[\s\S]*\}/); cfg=JSON.parse(m?m[0]:raw); }
    catch(e){ try{ cfg=(new Function('return ('+raw.match(/\{[\s\S]*\}/)[0]+')'))(); }catch(e2){ toast('firebaseConfig を読み取れませんでした'); return; } }
    if(!cfg||!cfg.projectId){toast('projectId が見つかりません');return;}
  }
  Cloud.setConf(cfg?{room,config:cfg}:undefined);
  closeSheet(); toast('接続しています…'); Cloud.stop(); Cloud.init();
}
function cloudOff(){ Cloud.setConf(null); Cloud.stop(); closeSheet(); toast('この端末だけで保存する設定にしました'); }
function cloudReset(){ Cloud.setConf(undefined); Cloud.stop(); closeSheet(); toast('初期設定に戻しました'); Cloud.init(); }
/* 押せば必ず最新版を取り直して読み込み直す（ホーム画面アプリ用の手動更新） */
async function forceUpdate(){
  if(location.protocol==='file:'){ toast('サーバーに置いた状態でお使いください'); return; }
  toast('最新の状態を取得しています…');
  try{ await fetch(location.pathname,{cache:'reload'}); }catch(e){ toast('通信できませんでした'); return; }
  setTimeout(()=>location.reload(),400);
}
function manualSync(){
  if(!Cloud.ready){ toast('まだ接続できていません。通信環境を確認してね'); return; }
  Cloud.push(); toast('クラウドに保存しました');
}
function expJSON(){
  const blob=new Blob([JSON.stringify(S,null,1)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download='futari-no-ouchi_'+todayY()+'.json'; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),3000); toast('書き出しました');
}
function impJSON(inp){
  const f=inp.files[0]; if(!f)return;
  const r=new FileReader();
  r.onload=()=>{ try{
      mergeState(JSON.parse(r.result)); S=ensure(S);
      saveLocal(); Cloud.push(); closeSheet(); render(); toast('取り込みました（新しい方を採用）');
    }catch(e){ toast('ファイルを読み取れませんでした'); } finally{ inp.value=''; } };
  r.readAsText(f);
}
async function resetAll(){
  if(!await askConfirm('家計簿・予定・家事・Wish・ルールをすべて消します。相手の端末からも消えます。よろしいですか？'))return;
    /* 相手の端末からも確実に消えるよう、削除マークを付けて同期する */
  const now=Date.now();
  ['expenses','events','chores','wishes','rules','payouts','moodLog','ledger','chat','aiLog'].forEach(k=>{
    S[k].forEach(x=>{ x.deleted=true; x.updatedAt=now; x.lastModifiedBy=ME; });
  });
  ['keisuke','kotomi'].forEach(u=>{ S.moods[u]={value:0,comment:'',updatedAt:now,lastModifiedBy:u}; });
  S.settings=Object.assign({},S.settings,{updatedAt:now,lastModifiedBy:ME});
  saveLocal(); closeSheet(); render(); Cloud.push(); toast('データを消しました');
}

/* URL末尾の #k=… から同期キーを受け取り、履歴に残らないよう消す */
function isStandalone(){
  return !!(window.navigator.standalone||(window.matchMedia&&matchMedia('(display-mode: standalone)').matches));
}
function takeKeyFromHash(){
  const m=location.hash.match(/[#&]k=([A-Za-z0-9_.\-]+)/);
  if(!m||!m[1])return false;
  const cur=localStorage.getItem(LS_ROOM);
  try{
    localStorage.setItem(LS_ROOM,m[1]);
    /* ホーム画面アプリとして起動しているときだけURLを整える。
       ブラウザ上では鍵を残す ← この状態で「ホーム画面に追加」すると鍵ごと登録されるため、
       ホーム画面アプリ側の保存領域が別でも、起動しただけで同期がつながる */
    if(isStandalone()) history.replaceState(null,'',location.pathname+location.search);
  }catch(e){}
  return cur!==m[1];
}
takeKeyFromHash();
/* アプリを開いたままリンクを踏んだ場合にも対応 */
window.addEventListener('hashchange',()=>{
  if(takeKeyFromHash()&&ME){ Cloud.stop(); Cloud.init(); toast('同期キーを設定しました'); }
});
icons();
/* 通信が復活したら自動で再接続 */
window.addEventListener('online',()=>{ if(ME&&!Cloud.ready)Cloud.init(); });
document.addEventListener('visibilitychange',()=>{
  if(document.hidden||!ME)return;
  if(!Cloud.ready)Cloud.init();
  maybeCheckUpdate();
});
