html,body{margin:0;padding:0}

.hidden{display:none !important}

function relTime(ts){
  if(!ts)return'';
  const m=Math.floor((Date.now()-ts)/60000);
  if(m<1)return'たった今'; if(m<60)return m+'分前';
  const h=Math.floor(m/60); if(h<24)return h+'時間前';
  const d=Math.floor(h/24); if(d===1)return'昨日'; if(d<7)return d+'日前';
  const t=new Date(ts); return (t.getMonth()+1)+'月'+t.getDate()+'日';
}

/* ---------- sample data ---------- */
function seed(){
  const now=Date.now();
  return {
    v:1,
    settings:{anniversary:'2024-06-02', updatedAt:now, lastModifiedBy:'keisuke'},
    moods:{
      keisuke:{value:0,comment:'',updatedAt:0,lastModifiedBy:'keisuke'},
      kotomi :{value:0,comment:'',updatedAt:0,lastModifiedBy:'kotomi'}
    },
    expenses:[], events:[], chores:[], wishes:[], rules:[]
  };
}
function ensure(s){
  const base=seed();
  if(!s)return base;
  ['expenses','events','chores','wishes','rules'].forEach(k=>{ if(!Array.isArray(s[k]))s[k]=[]; });
  s.settings=Object.assign({},base.settings,s.settings||{});
  s.moods=Object.assign({},base.moods,s.moods||{});
  return s;
}

/* ---------- merge (last-write-wins per item) ---------- */
function mergeArr(local,remote){
  const map=new Map(); (local||[]).forEach(x=>map.set(x.id,x));
  (remote||[]).forEach(r=>{ const l=map.get(r.id);
    if(!l || (r.updatedAt||0)>(l.updatedAt||0)) map.set(r.id,r); });
  return [...map.values()];
}
function mergeState(remote){
  if(!remote)return;
  ['expenses','events','chores','wishes','rules'].forEach(k=>{ S[k]=mergeArr(S[k],remote[k]); });
  ['keisuke','kotomi'].forEach(u=>{
    const r=remote.moods&&remote.moods[u]; if(r&&(r.updatedAt||0)>(S.moods[u].updatedAt||0)) S.moods[u]=r;
  });
  if(remote.settings&&(remote.settings.updatedAt||0)>(S.settings.updatedAt||0)) S.settings=remote.settings;
  // 30日以上前の削除済みを掃除
  const cut=Date.now()-30*864e5;
  ['expenses','events','chores','wishes','rules'].forEach(k=>{ S[k]=S[k].filter(x=>!(x.deleted&&(x.updatedAt||0)<cut)); });
}
const live=k=>(S[k]||[]).filter(x=>!x.deleted);

/* ---------- cloud sync (Firebase Firestore / optional) ---------- */
const Cloud={
  cfg:null, ready:false, status:'off', lastPushId:null, _db:null, _fs:null, _unsub:null,
  conf(){ let c=null; try{c=JSON.parse(localStorage.getItem(LS_CLOUD)||'null')}catch(e){}
    if(c&&c.off)return null;
    const room=(c&&c.room)||localStorage.getItem(LS_ROOM)||'';
    const config=(c&&c.config)||BUILTIN_CLOUD.config;
    if(!room||!config)return null;
    return {room,config}; },
  setConf(c){ if(c===null)localStorage.setItem(LS_CLOUD,JSON.stringify({off:true}));
    else if(c===undefined)localStorage.removeItem(LS_CLOUD);
    else localStorage.setItem(LS_CLOUD,JSON.stringify(c)); },
  dot(){ const d=$('#cloudDot'); if(!d)return; d.className='cloud-dot'+(this.status==='on'?' on':this.status==='err'?' err':''); },
  async init(){
    const c=this.conf(); if(!c||!c.config||!c.room){ this.status='off'; this.dot(); return; }
    this.status='wait'; this.dot();
    try{
      const [app,fs]=await Promise.all([
        import('https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js'),
        import('https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js')
      ]);
      const a=app.getApps&&app.getApps().length?app.getApps()[0]:app.initializeApp(c.config);
      this._fs=fs; this._db=fs.getFirestore(a); this.cfg=c; this.ready=true;
      const ref=fs.doc(this._db,'couples',c.room);
      if(this._unsub)this._unsub();
      this.firstSnap=true;
      this._unsub=fs.onSnapshot(ref,snap=>{
        this.status='on'; this.dot();
        const d=snap.data();
        if(this.firstSnap){
          this.firstSnap=false;
          if(!d||!d.payload){ freshInstall=false; this.push(); return; }
          try{
            const r=JSON.parse(d.payload);
            if(freshInstall) S=ensure(r);   /* この端末は初回 → 相手のデータをそのまま受け取る */
            else mergeState(r);
            freshInstall=false; saveLocal(); render(); toast('☁️ 同期しました');
            setTimeout(offerSampleCleanup,600);
          }catch(e){}
          if(this._pending){ this._pending=false; this.push(); }
          return;
        }
        if(!d||!d.payload)return;
        if(d.pushId===this.lastPushId)return;
        try{ mergeState(JSON.parse(d.payload)); saveLocal(); render(); toast('☁️ 相手の更新を受け取りました'); }catch(e){}
      },err=>{ this.status='err'; this.dot(); toast('同期エラー: '+err.code); });
    }catch(e){ this.status='err'; this.dot(); toast('📴 オフラインです。この端末に保存しています'); }
  },
  async push(){
    if(!this.ready)return;
    if(this.firstSnap){ this._pending=true; return; }
    try{
      this.lastPushId=uid();
      await this._fs.setDoc(this._fs.doc(this._db,'couples',this.cfg.room),
        {payload:JSON.stringify(S),pushId:this.lastPushId,at:Date.now(),by:ME});
      this.status='on'; this.dot();
    }catch(e){ this.status='err'; this.dot(); }
  },
  stop(){ if(this._unsub)this._unsub(); this._unsub=null; this.ready=false; this.status='off'; this.dot(); }
};

function shareOf(e){
  const a=Number(e.amount);
  const k=e.split==='half'?a/2:e.split==='keisuke'?a:0;
  return {k, ko:a-k};
}
function renderMoney(){
  const all=live('expenses').sort((a,b)=>b.date.localeCompare(a.date)||b.updatedAt-a.updatedAt);
  const list=ui.month==='all'?all:all.filter(e=>e.date.startsWith(ui.month));
  const tot=list.reduce((a,b)=>a+Number(b.amount),0);
  const byK=list.filter(e=>e.payer==='keisuke').reduce((a,b)=>a+Number(b.amount),0);
  const byKo=tot-byK;

/* ============================ CALENDAR ============================ */
function renderCal(){
  const evs=live('events');
  let body;
  if(ui.calMode==='month'){
    const [y,m]=ui.calCur.split('-').map(Number);
    const first=new Date(y,m-1,1), start=addDays(first,-first.getDay());
    let cells='';
    for(let i=0;i<42;i++){
      const d=addDays(start,i), s=ymd(d), out=d.getMonth()!==m-1;
      const de=evs.filter(e=>e.date===s);
      cells+=`<button class="cel ${out?'out':''} ${s===todayY()?'today':''} ${s===ui.calSel?'sel':''}" onclick="ui.calSel='${s}';render()">
        <span style="${d.getDay()===0?'color:var(--accent)':d.getDay()===6?'color:var(--k)':''}">${d.getDate()}</span>
        <span class="dots">${de.slice(0,3).map(e=>`<i style="background:${EV_CAT[e.cat].c}"></i>`).join('')}</span></button>`;
    }
    const sel=evs.filter(e=>e.date===ui.calSel).sort((a,b)=>(a.time||'99').localeCompare(b.time||'99'));
    const sd=pYMD(ui.calSel);
    body=`<div class="card">
      <div class="navmonth"><button onclick="mvCal(-1)"><i data-lucide="chevron-left"></i></button>
        <b>${y}年${m}月</b><button onclick="mvCal(1)"><i data-lucide="chevron-right"></i></button></div>
      <div class="cal">${['日','月','火','水','木','金','土'].map((w,i)=>`<div class="wd ${i===0?'n':i===6?'s':''}">${w}</div>`).join('')}${cells}</div>
    </div>
    <div class="card"><div class="sec-head"><h2>${sd.getMonth()+1}月${sd.getDate()}日（${'日月火水木金土'[sd.getDay()]}）の予定</h2></div>
      ${sel.length?sel.map(evLine).join(''):'<div class="empty"><div>🗓</div>この日の予定はありません</div>'}</div>`;
  }else{
    const up=evs.filter(e=>e.date>=todayY()).sort((a,b)=>a.date.localeCompare(b.date)||(a.time||'99').localeCompare(b.time||'99'));
    const past=evs.filter(e=>e.date<todayY()).sort((a,b)=>b.date.localeCompare(a.date)).slice(0,10);
    body=`<div class="card"><div class="sec-head"><h2><i data-lucide="calendar-clock"></i>これからの予定</h2></div>
      ${up.length?up.map(e=>evLine(e,true)).join(''):'<div class="empty"><div>🗓</div>予定がありません</div>'}</div>
      ${past.length?`<div class="card"><div class="sec-head"><h2 class="muted">過去の予定</h2></div>${past.map(e=>evLine(e,true)).join('')}</div>`:''}`;
  }
  $('#view-cal').innerHTML=
   `<div class="sec-head"><h2><i data-lucide="calendar-days"></i>共有カレンダー</h2>
      <button class="btn sm sp" onclick="evSheet()"><i data-lucide="plus"></i>予定を追加</button></div>
    <div class="chips">
      <button class="chip ${ui.calMode==='month'?'on':''}" onclick="ui.calMode='month';render()">月表示</button>
      <button class="chip ${ui.calMode==='list'?'on':''}" onclick="ui.calMode='list';render()">リスト表示</button>
      ${Object.entries(EV_CAT).map(([k,v])=>`<span class="chip" style="pointer-events:none"><i style="display:inline-block;width:7px;height:7px;border-radius:50%;background:${v.c};margin-right:5px"></i>${v.l}</span>`).join('')}
    </div>${body}`;
}

  const c=EV_CAT[e.cat]; const d=pYMD(e.date);
  return `<div class="evline">
    <div class="evbar" style="background:${c.c}"></div>
    ${showDate?`<div class="date-tag"><b>${d.getDate()}</b><span>${d.getMonth()+1}月(${'日月火水木金土'[d.getDay()]})</span></div>`:''}
    <div style="min-width:0;flex:1">
      <div style="font-weight:700;font-size:14px">${e.time?`<span class="pill" style="margin-right:5px">${e.time}</span>`:''}${esc(e.title)}</div>
      ${e.memo?`<div class="muted" style="margin-top:2px">${esc(e.memo)}</div>`:''}
      <div class="row" style="gap:5px;margin-top:5px;flex-wrap:wrap"><span class="pill" style="color:${c.c}">${c.l}</span>${editedBy(e)}</div>

      <div class="note" style="background:${NOTE_BG[r.color%NOTE_BG.length]}">
        <div class="tx">${esc(r.text)}</div>
        <div class="ft">${editedBy(r)}
          <div class="iact" style="margin-left:auto"><button onclick="rSheet('${r.id}')"><i data-lucide="pencil"></i></button>
            <button onclick="del('rules','${r.id}','このメモ')"><i data-lucide="trash-2"></i></button></div></div>
      </div>`).join(''):'<div class="empty"><div>📝</div>ふたりの決め事を書いてみよう</div>'}`;
}
function rSheet(id){
  const r=id?live('rules').find(x=>x.id===id):null;
  openSheet(`<h3><i data-lucide="scroll-text"></i>${r?'メモを編集':'約束を追加'}</h3>
    <label class="f"><span>内容</span><textarea class="inp" id="rTx" placeholder="例：けんかしても寝る前に仲直りする">${esc(r?r.text:'')}</textarea></label>
    <label class="f"><span>色</span><div class="seg" data-seg="rcol">${NOTE_BG.map((c,i)=>
      `<button type="button" data-v="${i}" class="${(r?r.color:0)===i?'on':''}" style="background:${c};height:44px" onclick="segPick(this)"></button>`).join('')}</div></label>
    <button class="btn" onclick="rSave('${id||''}')"><i data-lucide="check"></i>保存する</button>`);
}
function rSave(id){
  const t=document.getElementById('rTx').value.trim(); if(!t){toast('内容を入力してね');return;}
  const o={text:t,color:Number(segVal('rcol'))};
  if(id){const x=S.rules.find(v=>v.id===id);Object.assign(x,o);touch(x);}
  else S.rules.push(touch(Object.assign({id:uid(),deleted:false},o)));
  closeSheet(); save(); toast(id?'更新しました':'追加しました');
}

/* ============================ SETTINGS ============================ */
function openSettings(){
  const st=S.settings, room=localStorage.getItem(LS_ROOM)||'';
  const stat={off:'未接続（この端末のみ保存）',wait:'接続中…',on:'接続中 ✅ リアルタイム同期',err:'エラー ⚠️'}[Cloud.status];
  openSheet(`<h3><i data-lucide="settings"></i>設定</h3>
    <label class="f"><span>記念日（付き合った日）</span><input class="inp" id="sAnv" type="date" value="${esc(st.anniversary||'')}"></label>
    <div class="help" style="margin-bottom:12px">「次に会う日」は、カレンダーに登録した<b>「デート」「記念日」</b>の予定のうち、
      いちばん近いものから自動で計算されます。ここで設定する必要はありません。</div>
    <button class="btn" onclick="setSave()"><i data-lucide="check"></i>設定を保存</button>

    <h3 style="margin-top:26px"><i data-lucide="cloud"></i>ふたりで同期</h3>
    ${room?`<div class="help" style="margin-bottom:12px">
      <b>同期キー：設定ずみ ✅</b><br>
      けいすけさんとことみさんの端末が、同じ保存先につながっています。
      入力した内容は自動でおたがいの画面に反映されます。
      <div style="margin-top:8px">いまの状態：<b>${stat}</b></div></div>
    <div class="row" style="gap:8px">
      <button class="btn ghost" style="flex:1" onclick="manualSync()"><i data-lucide="refresh-cw"></i>今すぐ同期</button>
      <button class="btn ghost" style="flex:1" onclick="copyInvite()"><i data-lucide="link"></i>リンクをコピー</button>
    </div>`:`<div class="help" style="margin-bottom:12px;border:1.5px solid var(--accent2)">
      <b>⚠️ まだ同期キーがありません</b><br>
      この端末は、いまこの端末だけにデータを保存しています。
      もう一方の端末とつなぐには、<b>末尾に <code>#k=…</code> が付いたリンク</b>を開くか、
      下の詳細設定に同期キーを貼り付けてください。</div>`}
    <details style="margin-top:10px">
      <summary class="muted" style="cursor:pointer;padding:8px 0;font-weight:700">詳細設定（ふだんは触らなくて大丈夫）</summary>
      <label class="f" style="margin-top:10px"><span>同期キー（ふたり共通・秘密）</span>
        <input class="inp" id="cRoom" placeholder="kk-..." value="${esc(room)}"></label>
      ${room?`<label class="f"><span>相手に送るリンク（長押しでコピー）</span>
        <input class="inp" id="cLink" readonly onclick="this.select()" value="${esc(inviteURL())}"></label>`:''}
      <label class="f"><span>firebaseConfig（変更する場合のみ）</span>
        <textarea class="inp" id="cCfg" placeholder="通常は空のままでOK"></textarea></label>
      <div class="row" style="gap:8px">
        <button class="btn" style="flex:1" onclick="cloudSave()"><i data-lucide="cloud"></i>保存して接続</button>
        <button class="btn line" style="flex:0 0 42%" onclick="cloudReset()">初期設定に戻す</button>
      </div>
      <button class="btn line" style="width:100%;margin-top:8px;justify-content:center" onclick="cloudOff()">同期を使わない（この端末だけで保存）</button>
    </details>

    <h3 style="margin-top:26px"><i data-lucide="download"></i>データの持ち出し・取り込み</h3>
    <div class="muted" style="margin-bottom:10px">クラウドを使わない場合は、ファイルでデータを共有できます。</div>
    <div class="row" style="gap:8px">
      <button class="btn ghost" style="flex:1" onclick="expJSON()"><i data-lucide="download"></i>書き出し</button>
      <button class="btn ghost" style="flex:1" onclick="document.getElementById('impF').click()"><i data-lucide="upload"></i>取り込み</button>
    </div>
    <input type="file" id="impF" accept="application/json,.json" class="hidden" onchange="impJSON(this)">
    <button class="btn line" style="width:100%;margin-top:20px;justify-content:center" onclick="resetAll()"><i data-lucide="trash-2"></i>データをすべて消す</button>
    <div class="muted" style="text-align:center;margin-top:14px">ふたりのおうち　バージョン ${APP_VERSION}<br><span style="font-size:10px">更新したのに変わらないときは、画面を下に引っぱって再読み込みしてください</span></div>`);
}
function setSave(){
  S.settings=Object.assign({},S.settings,{anniversary:val('sAnv'),updatedAt:Date.now(),lastModifiedBy:ME});
  closeSheet(); save(); toast('設定を保存しました');
}
function inviteURL(){
  const r=localStorage.getItem(LS_ROOM)||'';
  if(location.protocol==='file:')return '#k='+r;
  return location.origin+location.pathname+'#k='+r;
}
function copyInvite(){
  const u=inviteURL();
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(u).then(()=>toast('リンクをコピーしました')).catch(()=>toast('詳細設定からコピーしてね'));
  }else toast('詳細設定の「相手に送るリンク」から長押しでコピーしてね');
}
function cloudSave(){
  const room=val('cRoom'); if(!room){toast('同期キーを入力してね');return;}
  localStorage.setItem(LS_ROOM,room);
  const raw=document.getElementById('cCfg').value.trim();
  let cfg=null;
  if(raw){
    try{ const m=raw.match(/\{[\s\S]*\}/); cfg=JSON.parse(m?m[0]:raw); }
    catch(e){ try{ cfg=(new Function('return ('+raw.match(/\{[\s\S]*\}/)[0]+')'))(); }catch(e2){ toast('firebaseConfig を読み取れませんでした'); return; } }
    if(!cfg||!cfg.projectId){toast('projectId が見つかりません');return;}
  }
  Cloud.setConf(cfg?{room,config:cfg}:undefined);
  closeSheet(); toast('接続しています…'); Cloud.stop(); Cloud.init();
}
function cloudOff(){ Cloud.setConf(null); Cloud.stop(); closeSheet(); toast('この端末だけで保存する設定にしました'); }
function cloudReset(){ Cloud.setConf(undefined); Cloud.stop(); closeSheet(); toast('初期設定に戻しました'); Cloud.init(); }
function manualSync(){
  if(!Cloud.ready){ toast('まだ接続できていません。通信環境を確認してね'); return; }
  Cloud.push(); toast('クラウドに保存しました');
}
function expJSON(){
  const blob=new Blob([JSON.stringify(S,null,1)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download='futari-no-ouchi_'+todayY()+'.json'; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),3000); toast('書き出しました');
}
function impJSON(inp){
  const f=inp.files[0]; if(!f)return;
  const r=new FileReader();
  r.onload=()=>{ try{ mergeState(JSON.parse(r.result)); saveLocal(); closeSheet(); render(); toast('取り込みました（新しい方を採用）'); }
    catch(e){ toast('ファイルを読み取れませんでした'); } };
  r.readAsText(f);
}
async function resetAll(){
  if(!await askConfirm('家計簿・予定・家事・Wish・ルールをすべて消します。相手の端末からも消えます。よろしいですか？'))return;
    /* 相手の端末からも確実に消えるよう、削除マークを付けて同期する */
  const now=Date.now();
  ['expenses','events','chores','wishes','rules'].forEach(k=>{
    S[k].forEach(x=>{ x.deleted=true; x.updatedAt=now; x.lastModifiedBy=ME; });
  });
  ['keisuke','kotomi'].forEach(u=>{ S.moods[u]={value:0,comment:'',updatedAt:now,lastModifiedBy:u}; });
  S.settings=Object.assign({},S.settings,{updatedAt:now,lastModifiedBy:ME});
  saveLocal(); closeSheet(); render(); Cloud.push(); toast('データを消しました');
}

/* ============================ INIT ============================ */
document.getElementById('pad').addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b)return;
  key(b.dataset.k||b.textContent.trim());
});
document.addEventListener('keydown',e=>{
  if(!$('#login').classList.contains('hidden')){
    if(/^[0-9]$/.test(e.key))key(e.key);
    else if(e.key==='Backspace')key('back');
  }
});
document.getElementById('tabbar').addEventListener('click',e=>{
  const b=e.target.closest('button'); if(b)go(b.dataset.t);
});
/* URL末尾の #k=… から同期キーを受け取り、履歴に残らないよう消す */
function takeKeyFromHash(){
  const m=location.hash.match(/[#&]k=([A-Za-z0-9_.\-]+)/);
  if(!m||!m[1])return false;
  const cur=localStorage.getItem(LS_ROOM);
  try{ localStorage.setItem(LS_ROOM,m[1]);
    history.replaceState(null,'',location.pathname+location.search); }catch(e){}
  return cur!==m[1];
}
takeKeyFromHash();
/* アプリを開いたままリンクを踏んだ場合にも対応 */
window.addEventListener('hashchange',()=>{
  if(takeKeyFromHash()&&ME){ Cloud.stop(); Cloud.init(); toast('同期キーを設定しました'); }
});
icons();
/* 通信が復活したら自動で再接続 */
window.addEventListener('online',()=>{ if(ME&&!Cloud.ready)Cloud.init(); });
document.addEventListener('visibilitychange',()=>{ if(!document.hidden&&ME&&!Cloud.ready)Cloud.init(); });
(function(){ const u=localStorage.getItem(LS_USER); if(u&&USERS[u])boot(u); })();
</script>
